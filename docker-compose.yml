services:
  postgres-server:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_sifresi
      - POSTGRES_DB=zabbix
    volumes:
      - ./zabbix-pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - zabbix-net
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:latest
    depends_on:
      - postgres-server
    environment:
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_sifresi
      - POSTGRES_DB=zabbix
      - ZBX_EXPORTDIR=/var/lib/zabbix/export
      - ZBX_EXPORTFILESIZE=10M
      - ZBX_EXPORTSTEP=15
    ports:
      - "10051:10051"
    volumes:
      - ./zabbix-export:/var/lib/zabbix/export
    networks:
      - zabbix-net
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:latest
    depends_on:
      - postgres-server
      - zabbix-server
    environment:
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_sifresi
      - POSTGRES_DB=zabbix
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=Europe/Istanbul
    ports:
      - "8080:8080"
    networks:
      - zabbix-net
    restart: unless-stopped

  zabbix-agent:
    image: zabbix/zabbix-agent:latest
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_HOSTNAME=Zabbix server
    pid: "host"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - zabbix-net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    depends_on:
      - postgres-server
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "5050:80"
    networks:
      - zabbix-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    networks:
      - zabbix-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - ./redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - zabbix-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - zabbix-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - zabbix-net
    restart: unless-stopped
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/data/airflow_metadata.db
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ETL:/opt/airflow/ETL
      - ./ml:/opt/airflow/ml
      - ./tools:/opt/airflow/tools
      - ./realtime:/opt/airflow/realtime
      - ./data:/opt/airflow/data
    networks:
      - zabbix-net
    command: >
      bash -c "airflow db migrate && 
      airflow users create --username admin --password admin --firstname Airflow --lastname Admin --role Admin --email admin@example.com"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-server:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/data/airflow_metadata.db
      # REST API icin basic auth (FastAPI'nin train tetiklemesi buradan gecer)
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - DB_HOST=postgres-server
      - DB_USER=zabbix
      - DB_PASSWORD=zabbix_sifresi
      - DB_NAME=zabbix
      - SQLITE_DB_PATH=/opt/airflow/data/zabbix_ml.db
      - ML_ARCHIVE_DIR=s3://zabbix-processed-data/archive/
      - ML_RETENTION_DAYS=30
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ETL:/opt/airflow/ETL
      - ./ml:/opt/airflow/ml
      - ./tools:/opt/airflow/tools
      - ./realtime:/opt/airflow/realtime
      - ./data:/opt/airflow/data
    ports:
      - "8081:8080"
    command: webserver
    networks:
      - zabbix-net
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-server:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/data/airflow_metadata.db
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - DB_HOST=postgres-server
      - DB_USER=zabbix
      - DB_PASSWORD=zabbix_sifresi
      - DB_NAME=zabbix
      - SQLITE_DB_PATH=/opt/airflow/data/zabbix_ml.db
      - ML_ARCHIVE_DIR=s3://zabbix-processed-data/archive/
      - ML_RETENTION_DAYS=30
      # Agir ML task'lari (retrain ~85sn) scheduler'i blokluyor; heartbeat
      # timeout'unu yukseltiyoruz yoksa DagFileProcessorManager kill edilip
      # kosan task failed isaretleniyor.
      - AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT=600
      - AIRFLOW__SCHEDULER__SCHEDULER_HEALTH_CHECK_THRESHOLD=600
      - AIRFLOW__SCHEDULER__ORPHANED_TASKS_CHECK_INTERVAL=600
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ETL:/opt/airflow/ETL
      - ./ml:/opt/airflow/ml
      - ./tools:/opt/airflow/tools
      - ./realtime:/opt/airflow/realtime
      - ./data:/opt/airflow/data
    command: scheduler
    networks:
      - zabbix-net
    restart: unless-stopped

  realtime-tailer:
    build:
      context: .
      dockerfile: Dockerfile.realtime
    command: >
      python -m realtime.tailer
      --export-dir /app/zabbix-export
      --redis-host redis
      --checkpoint-db /app/data/realtime.db
      --metrics-port 8002
      --interval 5
    volumes:
      - ./zabbix-export:/app/zabbix-export:ro
      - ./data:/app/data
    ports:
      - "8002:8002"
    networks:
      - zabbix-net
    depends_on:
      - redis
    restart: unless-stopped

  realtime-consumer:
    build:
      context: .
      dockerfile: Dockerfile.realtime
    environment:
      - DB_HOST=postgres-server
      - DB_PORT=5432
      - DB_USER=zabbix
      - DB_PASSWORD=zabbix_sifresi
      - DB_NAME=zabbix
    command: >
      python -m realtime.consumer
      --redis-host redis
      --db /app/data/realtime.db
      --metrics-port 8001
      --interval 1
    volumes:
      - ./data:/app/data
    ports:
      - "8001:8001"
    networks:
      - zabbix-net
    depends_on:
      - redis
      - postgres-server
    restart: unless-stopped

  ml-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - SQLITE_DB_PATH=/app/data/zabbix_ml.db
      - REALTIME_DB_PATH=/app/data/realtime.db
      - ML_MODELS_DIR=/app/data/models
      - GROUND_TRUTH_FILE=/app/data/ground_truth.jsonl
      - LOAD_TESTS_DIR=/app/load_tests
      - AIRFLOW_API_URL=http://airflow-webserver:8080/api/v1
      - AIRFLOW_USER=admin
      - AIRFLOW_PASSWORD=admin
      - REDIS_HOST=redis
      # Zabbix'e geri bildirim (ops.): dolu ise /feedback/anomaly buraya iletir
      - ZABBIX_WEBHOOK_URL=
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    networks:
      - zabbix-net
    depends_on:
      - redis
    restart: unless-stopped

networks:
  zabbix-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data: