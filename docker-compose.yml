version: '3.8'

services:
  postgres-server:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_sifresi
      - POSTGRES_DB=zabbix
    volumes:
      - ./zabbix-pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - zabbix-net
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:latest
    depends_on:
      - postgres-server
    environment:
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_sifresi
      - POSTGRES_DB=zabbix
    ports:
      - "10051:10051"
    networks:
      - zabbix-net
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:latest
    depends_on:
      - postgres-server
      - zabbix-server
    environment:
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_sifresi
      - POSTGRES_DB=zabbix
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=Europe/Istanbul
    ports:
      - "8080:8080"
    networks:
      - zabbix-net
    restart: unless-stopped

  zabbix-agent:
    image: zabbix/zabbix-agent:latest
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_HOSTNAME=Zabbix server
    pid: "host"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - zabbix-net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    depends_on:
      - postgres-server
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "5050:80"
    networks:
      - zabbix-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    networks:
      - zabbix-net
    restart: unless-stopped
  airflow-init:
    image: apache/airflow:2.10.3
    environment:
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas boto3 s3fs pyarrow psycopg2-binary
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/data/airflow_metadata.db
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ETL:/opt/airflow/ETL
      - ./ml:/opt/airflow/ml
      - ./tools:/opt/airflow/tools
      - ./data:/opt/airflow/data
    networks:
      - zabbix-net
    command: >
      bash -c "airflow db migrate && 
      airflow users create --username admin --password admin --firstname Airflow --lastname Admin --role Admin --email admin@example.com"

  airflow-webserver:
    image: apache/airflow:2.10.3
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-server:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas boto3 s3fs pyarrow psycopg2-binary
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/data/airflow_metadata.db
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - DB_HOST=postgres-server
      - DB_USER=zabbix
      - DB_PASSWORD=zabbix_sifresi
      - DB_NAME=zabbix
      - SQLITE_DB_PATH=/opt/airflow/data/zabbix_ml.db
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ETL:/opt/airflow/ETL
      - ./ml:/opt/airflow/ml
      - ./tools:/opt/airflow/tools
      - ./data:/opt/airflow/data
    ports:
      - "8081:8080"
    command: webserver
    networks:
      - zabbix-net
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.10.3
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-server:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas boto3 s3fs pyarrow psycopg2-binary
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/data/airflow_metadata.db
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - DB_HOST=postgres-server
      - DB_USER=zabbix
      - DB_PASSWORD=zabbix_sifresi
      - DB_NAME=zabbix
      - SQLITE_DB_PATH=/opt/airflow/data/zabbix_ml.db
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ETL:/opt/airflow/ETL
      - ./ml:/opt/airflow/ml
      - ./tools:/opt/airflow/tools
      - ./data:/opt/airflow/data
    command: scheduler
    networks:
      - zabbix-net
    restart: unless-stopped
networks:
  zabbix-net:
    driver: bridge